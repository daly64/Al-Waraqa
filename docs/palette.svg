<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" width="760" height="150" role="img" aria-label="Palette Al Waraqa : brique, terre cuite, sable, papier, crème, encre">
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#808080}.n{font-weight:600;font-size:14px}.h{font-size:12px}</style>
